<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>测测你的隐藏性格</title>
<style>
  :root{
    --bg1:#fff6f3; --bg2:#f3ecff;
    --card:#ffffff; --ink:#3d3550; --ink2:#8a82a0;
    --accent:#7c5cff; --accent2:#ff7a9c;
    --grad:linear-gradient(135deg,#7c5cff 0%,#ff7a9c 100%);
    --shadow:0 12px 40px rgba(124,92,255,.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,var(--bg1) 0%,var(--bg2) 100%);
    color:var(--ink); min-height:100%; overflow-x:hidden;
  }
  .wrap{max-width:560px;margin:0 auto;padding:24px 20px 60px;position:relative;}

  /* 封面 */
  .cover{min-height:calc(100vh - 48px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .logo{font-size:64px;line-height:1;margin-bottom:20px;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .cover h1{font-size:30px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-bottom:14px;}
  .cover .sub{color:var(--ink2);font-size:15px;line-height:1.7;margin-bottom:8px;}
  .cover .badge{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:8px 16px;font-size:13px;color:var(--ink2);box-shadow:var(--shadow);margin-bottom:34px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    background:var(--grad);color:#fff;border:none;border-radius:999px;
    padding:16px 44px;font-size:17px;font-weight:700;cursor:pointer;
    box-shadow:0 10px 30px rgba(124,92,255,.35);transition:transform .15s ease,box-shadow .15s ease;
  }
  .btn:active{transform:scale(.96);}
  .btn.ghost{background:#fff;color:var(--accent);box-shadow:var(--shadow);}
  .cover .hint{color:#c0b9d4;font-size:12px;margin-top:18px;}

  /* 答题 */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;}
  .topbar .num{font-size:14px;font-weight:700;color:var(--accent);}
  .topbar .total{font-size:13px;color:var(--ink2);}
  .progress{height:8px;background:#fff;border-radius:99px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.06);margin-bottom:26px;}
  .progress .bar{height:100%;background:var(--grad);border-radius:99px;transition:width .35s ease;width:0;}
  .qcard{background:var(--card);border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);}
  .qtag{display:inline-block;font-size:12px;font-weight:700;color:#fff;background:var(--grad);border-radius:8px;padding:4px 12px;margin-bottom:16px;}
  .qtitle{font-size:19px;font-weight:800;line-height:1.5;margin-bottom:20px;}
  .options{display:flex;flex-direction:column;gap:12px;}
  .opt{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    background:#faf9ff;border:2px solid transparent;border-radius:16px;
    padding:16px 18px;font-size:15px;color:var(--ink);line-height:1.5;cursor:pointer;
    transition:all .18s ease;font-family:inherit;
  }
  .opt .key{
    flex:0 0 34px;height:34px;border-radius:10px;background:#efeaff;color:var(--accent);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
    transition:all .18s ease;
  }
  .opt:hover{border-color:#dcd2ff;}
  .opt.sel{background:#f1ecff;border-color:var(--accent);}
  .opt.sel .key{background:var(--accent);color:#fff;}

  /* 付费墙 */
  .paywall{text-align:center;animation:fadeIn .5s ease;}
  .code-input{width:100%;max-width:280px;padding:14px 18px;margin-bottom:14px;border:2px solid #e2dcf5;border-radius:14px;font-size:16px;text-align:center;outline:none;transition:border-color .2s;box-sizing:border-box;}
  .code-input:focus{border-color:#7c5cff;}
  .code-input.shake{animation:shake .5s ease;}
  @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pay-head{font-size:23px;font-weight:800;margin:2px 0 6px;}
  .pay-sub{color:var(--ink2);font-size:14px;margin-bottom:20px;line-height:1.6;}
  .pay-sub b{color:var(--accent2);font-size:17px;}
  .tabs{display:flex;gap:10px;margin-bottom:16px;}
  .tab{flex:1;background:#fff;border:2px solid transparent;border-radius:14px;padding:13px;font-size:14px;font-weight:700;color:var(--ink2);cursor:pointer;font-family:inherit;transition:all .18s ease;box-shadow:var(--shadow);}
  .tab.on{border-color:var(--accent);color:var(--accent);background:#f1ecff;}
  .qr-box{background:#fff;border-radius:24px;padding:16px;box-shadow:var(--shadow);margin-bottom:20px;}
  .qr-box img{width:100%;max-width:330px;border-radius:14px;display:block;margin:0 auto;}
  .qr-tip{font-size:13px;color:var(--ink2);margin-top:10px;}
  .pay-note{font-size:12px;color:#c0b9d4;margin-top:14px;}

  /* 结果 */
  .result{text-align:center;animation:fadeIn .5s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  .res-badge{font-size:13px;font-weight:700;color:var(--accent);letter-spacing:1px;margin-bottom:12px;}
  .res-emoji{font-size:84px;line-height:1;margin-bottom:10px;animation:pop .5s cubic-bezier(.3,1.6,.5,1);}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .res-code{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:3px;margin-bottom:6px;}
  .res-name{font-size:30px;font-weight:800;margin-bottom:4px;}
  .res-nick{font-size:16px;color:var(--ink2);margin-bottom:20px;}
  .res-card{background:#fff;border-radius:24px;padding:26px 22px;box-shadow:var(--shadow);text-align:left;margin-bottom:18px;}
  .res-card h3{font-size:14px;color:var(--ink2);font-weight:700;margin-bottom:10px;letter-spacing:1px;}
  .res-card p{font-size:15px;line-height:1.85;color:var(--ink);}
  .keywords{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:18px;}
  .kw{background:#f1ecff;color:var(--accent);font-size:13px;font-weight:600;border-radius:999px;padding:6px 14px;}
  .dims{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px;}
  .dim{background:#fff;border-radius:14px;padding:12px 6px;box-shadow:var(--shadow);}
  .dim .d{font-size:16px;font-weight:800;color:var(--accent);}
  .dim .l{font-size:11px;color:var(--ink2);margin-top:2px;}
  .actions{display:flex;flex-direction:column;gap:12px;}
  .code-row{display:flex;gap:10px;margin-bottom:6px;}
  .code-row input{flex:1;min-width:0;border:2px solid #e5e0f5;border-radius:14px;padding:14px 16px;font-size:16px;color:var(--ink);outline:none;font-family:inherit;background:#fff;}
  .code-row input:focus{border-color:var(--accent);}
  .code-row .btn{padding:14px 22px;white-space:nowrap;}
  .modal{position:fixed;inset:0;background:rgba(30,20,50,.72);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px;}
  .modal-inner{background:#fff;border-radius:20px;padding:18px;text-align:center;max-width:92vw;max-height:92vh;overflow:auto;}
  .modal-head{font-size:14px;color:var(--ink2);margin-bottom:12px;font-weight:700;}
  #posterImg{width:100%;max-width:360px;border-radius:14px;display:block;margin:0 auto 14px;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

  <!-- 封面 -->
  <section id="cover" class="cover">
    <div class="logo">🔮</div>
    <h1>测测你的隐藏性格</h1>
    <p class="sub">16 道题 · 每题四选一</p>
    <p class="sub">凭第一直觉作答，别想太久哦</p>
    <div class="badge">✨ 约 3 分钟 · 看看真实的你</div>
    <button class="btn" onclick="start()">开始测试 →</button>
    <p class="hint">结果仅供娱乐，放松作答就好</p>

  <!-- 答题 -->
  <section id="quiz" class="hidden">

var qrcode = function() {

        for (var c = -1; c <= 7; c += 1) {

          }

      var minLostPoint = 0;
      var pattern = 0;

        }

        } else if (i < 8) {

        } else {

      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }

      var byteIndex = 0;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxEcCount = Math.max(maxEcCount, ecCount);

        offset += dcCount;

        var modPoly = rawPoly.mod(rsPoly);

        for (var i = 0; i < ecdata[r].length; i += 1) {

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

            data[index] = dcdata[r][i];
            index += 1;
          }
        }

          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);

      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);

        break;

        break;

const DIM_LABEL = {EI:"能量来源",SN:"信息方式",TF:"决策方式",JP:"生活节奏"};
const DIM_PAIR = {EI:["E 外向","I 内向"],SN:["S 实感","N 直觉"],TF:["T 理性","F 情感"],JP:["J 计划","P 随性"]};

let current = 0, scores = {EI:0,SN:0,TF:0,JP:0};

function start(){ document.getElementById("cover").classList.add("hidden"); document.getElementById("quiz").classList.remove("hidden"); render(); }
function reset(){ scores={EI:0,SN:0,TF:0,JP:0}; current=0; document.getElementById("result").classList.add("hidden"); document.getElementById("cover").classList.remove("hidden"); }

function render(){
  const q = QUESTIONS[current];
  document.getElementById("qnum").textContent = "第 " + (current+1) + " 题";
  document.getElementById("qtotal").textContent = (current+1) + " / " + QUESTIONS.length;
  document.getElementById("bar").style.width = ((current)/QUESTIONS.length*100) + "%";
  document.getElementById("qtag").textContent = DIM_LABEL[q.dim] + " · " + q.title;
  document.getElementById("qtitle").textContent = q.q;
  const box = document.getElementById("qoptions"); box.innerHTML = "";
  const keys = ["A","B","C","D"];
  q.opts.forEach((o,i)=>{
    const b = document.createElement("button");
    b.className = "opt";
    b.innerHTML = '<span class="key">'+keys[i]+'</span><span>'+o+'</span>';
    b.onclick = ()=>choose(i);
    box.appendChild(b);
  });
}

function choose(i){
  const q = QUESTIONS[current];
  // 计分：A=+2 B=+1 C=-1 D=-2，reverse 时取反
  let v = [2,1,-1,-2][i];
  if(q.reverse) v = -v;
  scores[q.dim] += v;
  current++;
  if(current >= QUESTIONS.length){ showResult(); }
  else { document.getElementById("bar").style.width = (current/QUESTIONS.length*100)+"%"; render(); }
}

function showResult(){
  let code = "";
  code += scores.EI > 0 ? "E" : "I";
  code += scores.SN > 0 ? "S" : "N";
  code += scores.TF > 0 ? "T" : "F";
  code += scores.JP > 0 ? "J" : "P";
  const t = TYPES[code];
  resultCode = code;
  document.getElementById("remoji").textContent = t.emoji;
  document.getElementById("rcode").textContent = code;
  document.getElementById("rname").textContent = t.name;
  document.getElementById("rnick").textContent = t.nick;
  document.getElementById("rdesc").textContent = t.desc;
  document.getElementById("rtip").textContent = t.tip;
  const keysBox = document.getElementById("rkeys"); keysBox.innerHTML = "";
  t.keys.forEach(k=>{ const s=document.createElement("span"); s.className="kw"; s.textContent=k; keysBox.appendChild(s); });
  const dimsBox = document.getElementById("rdims"); dimsBox.innerHTML = "";
  [["EI","E","I"],["SN","S","N"],["TF","T","F"],["JP","J","P"]].forEach(([dim,a,b])=>{
    const v = scores[dim]; const pick = v>0?a:b;
    const pct = Math.min(100, Math.round(50 + Math.abs(v)/8*50));
    const d=document.createElement("div"); d.className="dim";
    d.innerHTML = '<div class="d">'+pick+'</div><div class="l">'+DIM_PAIR[dim][0].split(" ")[1]+' / '+DIM_PAIR[dim][1].split(" ")[1]+' '+pct+'%</div>';
    dimsBox.appendChild(d);
  });
  document.getElementById("quiz").classList.add("hidden");
  document.getElementById("paywall").classList.remove("hidden");
  window.scrollTo(0,0);
}

/* 解锁方式说明（口令解锁）：
   用户付款后在收款留言/备注里写上口令，你确认到账后把口令回复给他，
   他输入口令才能解锁。口令不存明文，只存哈希，防止被查源码直接抠出来。

   ▶ 如何更换口令：
   1. 想好新口令（比如 2026SPRING），用浏览器控制台（F12）运行：
      function hash(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0}return h.toString(36)}
      hash("2026SPRING")
   2. 把输出的字符串替换下面的 UNLOCK_HASH 即可，其余不用动。 */
const UNLOCK_HASH = "16fljy1"; // 当前口令：SBTI099（仅你知晓，勿外传）

function hash(s){
  let h=5381;
  for(let i=0;i<s.length;i++){ h=((h<<5)+h+s.charCodeAt(i))>>>0; }
  return h.toString(36);
}

function checkCode(){
  const btn = document.getElementById("unlockBtn");
  const input = document.getElementById("codeInput");
  const code = (input.value||"").trim().toUpperCase();
  if(!code){ input.focus(); return; }
  btn.textContent = "校验中…";
  setTimeout(()=>{
    btn.textContent = "解锁报告 →";
    if(hash(code) === UNLOCK_HASH){
      document.getElementById("paywall").classList.add("hidden");
      document.getElementById("result").classList.remove("hidden");
      window.scrollTo(0,0);
    } else {
      input.value = ""; input.focus();
      input.placeholder = "口令不对哦，请核对支付后的回复";
      input.classList.add("shake");
      setTimeout(()=>input.classList.remove("shake"), 500);
    }
  }, 400);
}

function share(){
  const t = document.getElementById("rcode").textContent + " " + document.getElementById("rname").textContent;
  const text = "我测出来的隐藏性格是【"+t+"】，你也来测测？";
  if(navigator.share){ navigator.share({title:"测测你的隐藏性格",text:text,url:location.href}).catch(()=>{}); }
  else if(navigator.clipboard){ navigator.clipboard.writeText(location.href).then(()=>alert("链接已复制，快发给朋友吧~")); }
  else { alert("请复制地址栏链接分享给朋友~"); }
}

/* ===== 海报生成 ===== */
let resultCode = "";

function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function wrapText(ctx,text,x,y,maxW,lineH){
  const chars = text.split(""); let line=""; let n=0;
  for(const ch of chars){
    if(ctx.measureText(line+ch).width > maxW){ ctx.fillText(line,x,y+n*lineH); n++; line=ch; }
    else line+=ch;
  }
  if(line) ctx.fillText(line,x,y+n*lineH);
}

function genPoster(){
  const t = TYPES[resultCode];
  const W=600, H=1020;
  const c=document.createElement("canvas"); c.width=W; c.height=H;
  const ctx=c.getContext("2d");
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,"#7c5cff"); g.addColorStop(1,"#ff7a9c");
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.textAlign="center"; ctx.fillStyle="#fff";
  ctx.font="bold 44px sans-serif"; ctx.fillText("测测你的隐藏性格", W/2, 78);
  ctx.font="20px sans-serif"; ctx.fillStyle="rgba(255,255,255,.92)";
  ctx.fillText("你的隐藏性格是", W/2, 122);
  ctx.fillStyle="#fff"; roundRect(ctx,36,150,W-72,560,26); ctx.fill();
  ctx.font="92px sans-serif"; ctx.fillText(t.emoji, W/2, 262);
  ctx.fillStyle="#7c5cff"; ctx.font="bold 26px sans-serif"; ctx.fillText(resultCode, W/2, 308);
  ctx.fillStyle="#3d3550"; ctx.font="bold 46px sans-serif"; ctx.fillText(t.name, W/2, 366);
  ctx.fillStyle="#8a82a0"; ctx.font="24px sans-serif"; ctx.fillText(t.nick, W/2, 404);
  const kwW=112, kwH=44, gap=16;
  const totalW=kwW*t.keys.length+gap*(t.keys.length-1);
  let kx=W/2-totalW/2, ky=444;
  t.keys.forEach(k=>{
    roundRect(ctx,kx,ky,kwW,kwH,22); ctx.fillStyle="#f1ecff"; ctx.fill();
    ctx.fillStyle="#7c5cff"; ctx.font="bold 22px sans-serif"; ctx.textAlign="center";
    ctx.fillText(k, kx+kwW/2, ky+30); kx+=kwW+gap;
  });
  ctx.textAlign="left"; ctx.fillStyle="#3d3550"; ctx.font="22px sans-serif";
  wrapText(ctx, t.desc, 76, 524, W-152, 36);
  ctx.textAlign="center"; ctx.fillStyle="#fff";
  roundRect(ctx, W/2-120, 745, 240, 220, 20); ctx.fill();
  ctx.fillStyle="#fff"; ctx.font="bold 26px sans-serif";
  ctx.fillText("扫码测测你的隐藏性格", W/2, 1000);
  try{
    drawQR(ctx, location.href, W/2-90, 765, 180, "#3d3550", "#ffffff");
  }catch(e){
    ctx.fillStyle="#c0b9d4"; ctx.font="22px sans-serif"; ctx.fillText("复制链接参与测试", W/2, 862);
  }
  finishPoster(c);
}

/* 本地生成二维码（不依赖外部接口，避免 canvas 跨域污染导致海报导出失败） */
function drawQR(ctx, text, x, y, size, dark, light){
  const qr = qrcode(0, "M");
  qr.addData(text);
  qr.make();
  const count = qr.getModuleCount();
  const cell = size / count;
  ctx.fillStyle = light; ctx.fillRect(x, y, size, size);
  ctx.fillStyle = dark;
  for(let r=0;r<count;r++){
    for(let c=0;c<count;c++){
      if(qr.isDark(r,c)) ctx.fillRect(x+c*cell, y+r*cell, Math.ceil(cell)+0.5, Math.ceil(cell)+0.5);
    }
  }
}

function finishPoster(c){
  let url = "";
  try{ url = c.toDataURL("image/png"); }catch(e){ url = ""; }
